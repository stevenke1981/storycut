[package]
name = "storycut-desktop"
version = "0.1.0"
description = "StoryCut local non-linear video editor"
authors = ["StoryCut"]
edition = "2024"
license = "MIT"

[workspace]

[lib]
name = "storycut_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
storycut-command = { path = "../../crates/storycut-command" }

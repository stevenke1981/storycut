name: Windows build and tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract validation
        run: |
          python -m pip install -r requirements-validation.txt
          python -X utf8 tools/validate_spec.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s tests -q
      - name: Install FFmpeg for real media tests
        shell: pwsh
        run: |
          choco install ffmpeg-full --version=8.1.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          $ffprobe = (Get-Command ffprobe -ErrorAction Stop).Source
          & $ffmpeg -version | Select-Object -First 1
          & $ffprobe -version | Select-Object -First 1
          $assFilter = & $ffmpeg -hide_banner -h filter=ass 2>&1 | Out-String
          if ($assFilter -notmatch 'Render ASS subtitles') { throw 'FFmpeg libass filter is unavailable.' }
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Frontend build
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Desktop bridge tests and locked dependencies
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --lib
      - name: CLI build
        run: cargo build --release -p storycut-cli --locked
      - name: CLI real audio offset acceptance
        run: python -X utf8 tests/product_acceptance/audio_offset.py
      - name: Story assembly, MCP motion and real 72-image render
        run: python -X utf8 tests/product_acceptance/story_workflow.py
      - name: Night Lantern narration, holds, ducking and ASS acceptance
        run: python -X utf8 tests/product_acceptance/night_lantern.py --cli target/release/storycut.exe
      - name: Upload media acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-acceptance-reports
          path: |
            target/night-lantern-acceptance/**/report.json
            target/story-workflow-acceptance/**/report.json
          if-no-files-found: warn
      - name: Desktop executable
        working-directory: desktop
        run: npm run tauri build -- --no-bundle
      - name: Portable archive
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: storycut-portable-windows-x64
          path: dist/StoryCut-*-portable-windows-x64.zip
          if-no-files-found: error
